<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirim Pesan WhatsApp (Twilio)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f3f3; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.2); width: 320px; text-align: center; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; }
    button { width: 100%; background: #25D366; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1ebe57; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Kirim WhatsApp via Twilio</h2>
    <input type="text" id="phone" placeholder="Nomor HP (contoh: 6281234567890)" />
    <textarea id="message" rows="4" placeholder="Tulis pesan di sini..."></textarea>
    <button id="sendBtn">Kirim</button>
    <p id="status"></p>
  </div>

  <script>
    document.getElementById("sendBtn").addEventListener("click", async () => {
      const phone = document.getElementById("phone").value.trim();
      const message = document.getElementById("message").value.trim();
      const status = document.getElementById("status");

      status.textContent = "Mengirim...";
      try {
        const res = await fetch("/send-whatsapp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, message })
        });
        const data = await res.json();

        if (data.success) {
          status.textContent = "✅ Pesan berhasil dikirim!";
        } else {
          status.textContent = "❌ Gagal: " + (data.error || "Tidak diketahui");
        }
      } catch (err) {
        status.textContent = "⚠️ Terjadi error saat mengirim.";
      }
    });
  </script>
</body>
</html>
